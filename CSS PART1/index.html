<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Color</title>
    <!-- style tag -->
    <style>
        h1{
            color:red;
        }
        h2{
            color:blue;
            background-color:rgb(127, 139, 172);
        }
    </style>
</head>
<body>
    <!-- Inline style -->
    <h1 style="color:rgba(12, 102, 51, 0.304);">Hello World</h1>
    <p style="color:rgb(115, 9, 26);">This is a paragraph.</p>
    <hr>
    <!-- style tag -->
    <h1>Apna College</h1>
    <h1>Kishan</h1>
    <h2>MBM University</h2>
</body>
</html>
